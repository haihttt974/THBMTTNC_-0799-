<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THBMTTNC - LÊ DUY HẢI</title>

    <!-- Bootstrap & Icon -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

    <style>
      body {
        background: linear-gradient(135deg, #e3f2fd, #ffffff);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .card-ui {
        background: #fff;
        border-radius: 20px;
        padding: 40px 30px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        max-width: 600px;
        width: 100%;
        text-align: center;
      }

      .logo-row {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 30px;
        margin-bottom: 20px;
      }

      .logo {
        max-height: 70px;
        filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.1));
        transition: transform 0.3s ease;
      }

      .logo:hover {
        transform: scale(1.08);
      }

      .title {
        font-size: 1.4rem;
        font-weight: 700;
        background: linear-gradient(to right, #0066ff, #00c6ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 6px;
      }

      .subtitle {
        color: #6c757d;
        margin-bottom: 25px;
      }

      .section-title {
        font-weight: 600;
        font-size: 1.15rem;
        color: #212529;
        margin: 15px 0 25px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
      }

      .cipher-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 14px 20px;
        margin-bottom: 15px;
        background: linear-gradient(135deg, #007bff, #00b4db);
        color: white;
        border: none;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 500;
        font-size: 1.05rem;
        box-shadow: 0 6px 15px rgba(0, 123, 255, 0.3);
        transition: all 0.3s ease;
      }

      .cipher-btn:hover {
        transform: translateY(-3px) scale(1.02);
        box-shadow: 0 10px 20px rgba(0, 123, 255, 0.45);
      }
    </style>
  </head>

  <body>
    <div class="card-ui">
      <!-- Logo -->
      <div class="logo-row">
        <img
          src="https://file1.hutech.edu.vn/file/editor/homepage/stories/hinh34/logo%20CMYK-01.png"
          alt="HUTECH Logo"
          class="logo"
        />
        <img
          src="https://file1.hutech.edu.vn/file/editor/homepage1/449223-imgpsh_fullsize_anim-6.jpg"
          alt="30 năm"
          class="logo"
        />
      </div>

      <!-- Tiêu đề -->
      <div class="title">BÀI THỰC HÀNH KẾT THÚC MÔN HỌC: THBMTTNC</div>
      <div class="subtitle">LÊ DUY HẢI - 2280600799</div>

      <!-- Giao diện mã hóa -->
      <div class="section-title">
        <i class="bi bi-shield-lock-fill text-success"></i> MỞ GIAO DIỆN MÃ HÓA
        BẰNG QT
      </div>

      <div class="d-grid gap-2 col-10 mx-auto">
        <a href="#" onclick="openQtForm('/open/caesar')" class="cipher-btn">
          <i class="bi bi-shield-fill-check"></i> Caesar Cipher
        </a>
        <a href="#" onclick="openQtForm('/open/vigenere')" class="cipher-btn">
          <i class="bi bi-code-slash"></i> Vigenère Cipher
        </a>
        <a href="#" onclick="openQtForm('/open/railfence')" class="cipher-btn">
          <i class="bi bi-bricks"></i> Rail Fence Cipher
        </a>
        <a href="#" onclick="openQtForm('/open/playfair')" class="cipher-btn">
          <i class="bi bi-diagram-3-fill"></i> Playfair Cipher
        </a>
      </div>
    </div>

    <!-- Modal Thông báo -->
    <div
      class="modal fade"
      id="qtModal"
      tabindex="-1"
      aria-labelledby="qtModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
          <div class="modal-header">
            <h5 class="modal-title" id="qtModalLabel">Đang mở ứng dụng Qt</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Đóng"
            ></button>
          </div>
          <div class="modal-body text-center">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-3 mb-0">
              Giao diện đang được mở.<br />Vui lòng kiểm tra cửa sổ bên ngoài
              trình duyệt.
            </p>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Gọi Qt + GSAP -->
    <script>
      gsap.from(".card-ui", {
        opacity: 0,
        y: 60,
        duration: 1,
        ease: "power3.out",
      });

      function openQtForm(url) {
        console.log("Gọi đến:", url);
        fetch(url)
          .then((response) => {
            if (!response.ok) throw new Error("Lỗi HTTP: " + response.status);
            return response.json();
          })
          .then((data) => {
            console.log("Server trả về:", data);
            if (data.status === "success") {
              const qtModal = new bootstrap.Modal(
                document.getElementById("qtModal")
              );
              qtModal.show();
            } else {
              alert("Lỗi phía server: " + data.message);
            }
          })
          .catch((error) => {
            alert("Không thể kết nối tới server: " + error.message);
            console.error(error);
          });
      }
    </script>
  </body>
</html>
